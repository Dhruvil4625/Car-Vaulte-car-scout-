{% extends 'base.html' %}
{% block title %}My Exports | Vehicle Vault{% endblock %}
{% block content %}
<section class="container mb-5">
  <div class="row g-4">
    <aside class="col-lg-3 d-none d-lg-block">
      {% include 'users/sidebar.html' %}
    </aside>
    <div class="col-lg-9">
      <div class="dash-card reveal" style="transition-delay:0.1s;">
        <div class="dash-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0"><i class="fa-solid fa-file-export me-2"></i> My Exports</h5>
        </div>
        <p class="text-muted">Download your {% if role == 'Seller' %}sales{% else %}purchase{% endif %} history.</p>
        <div class="d-flex gap-2">
          <a href="{% url 'transactions_export' %}?format=csv" class="btn btn-outline-dark"><i class="fa-solid fa-file-csv me-1"></i> Export CSV</a>
          <a href="{% url 'transactions_export' %}?format=pdf" class="btn btn-outline-dark"><i class="fa-solid fa-file-pdf me-1"></i> Export PDF</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
